name: Build tailwind-react

on:
  push:
    branches: [main]
    paths:
      - "tailwind-react/app/**"
      - "tailwind-react/package.json"
      - "tailwind-react/package-lock.json"
      - "tailwind-react/vite.config.js"
      - ".github/workflows/deploy-tailwind-react.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tailwind-react/package-lock.json

      - name: Install dependencies
        working-directory: tailwind-react
        run: npm ci

      - name: Build
        working-directory: tailwind-react
        run: npm run build

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A tailwind-react
          git diff --cached --quiet && exit 0
          git commit -m "Build tailwind-react [skip ci]"
          git push
