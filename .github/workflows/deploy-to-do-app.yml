name: Build to-do-app

on:
  push:
    branches: [main]
    paths:
      - "to-do-app/app/**"
      - "to-do-app/package.json"
      - "to-do-app/package-lock.json"
      - "to-do-app/vite.config.ts"
      - ".github/workflows/deploy-to-do-app.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: to-do-app/package-lock.json

      - name: Install dependencies
        working-directory: to-do-app
        run: npm ci

      - name: Build
        working-directory: to-do-app
        run: npm run build

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A to-do-app
          git diff --cached --quiet && exit 0
          git commit -m "Build to-do-app [skip ci]"
          git push
